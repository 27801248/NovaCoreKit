name: Build NovaCoreKit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 framework
        run: |
          mkdir -p build/NovaCoreKit.framework/Headers
          mkdir -p build/NovaCoreKit.framework/Modules

          # 编译 arm64 二进制
          xcrun clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -fmodules \
            -I Headers \
            -framework Foundation \
            -framework UIKit \
            -framework Security \
            -dynamiclib \
            -install_name @rpath/NovaCoreKit.framework/NovaCoreKit \
            -o build/NovaCoreKit.framework/NovaCoreKit \
            Sources/*.m

          # 复制头文件和配置
          cp Headers/*.h build/NovaCoreKit.framework/Headers/
          cp Info.plist build/NovaCoreKit.framework/
          cp PrivacyInfo.xcprivacy build/NovaCoreKit.framework/

          # 生成 modulemap
          cat > build/NovaCoreKit.framework/Modules/module.modulemap << 'EOF'
          framework module NovaCoreKit {
              umbrella header "NovaCoreKit.h"
              export *
              module * { export * }
          }
          EOF

          # 伪签名
          ldid -S build/NovaCoreKit.framework/NovaCoreKit

          # 验证
          ls -la build/NovaCoreKit.framework/
          file build/NovaCoreKit.framework/NovaCoreKit

      - name: 打包
        run: |
          cd build
          tar -czf ../NovaCoreKit.framework.tar.gz NovaCoreKit.framework/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NovaCoreKit.framework
          path: NovaCoreKit.framework.tar.gz
