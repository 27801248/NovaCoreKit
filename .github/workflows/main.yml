name: Build NovaCoreKit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: |
          mkdir -p output/NovaCoreKit.framework/Headers
          mkdir -p output/NovaCoreKit.framework/Modules

          xcrun clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -I . \
            -framework Foundation -framework UIKit -framework Security \
            -dynamiclib \
            -install_name @rpath/NovaCoreKit.framework/NovaCoreKit \
            -o output/NovaCoreKit.framework/NovaCoreKit \
            NovaCoreKitCrypto.m NovaCoreKitDevice.m NovaCoreKitKeychain.m NovaCoreKitUI.m

          ls -la output/NovaCoreKit.framework/
          file output/NovaCoreKit.framework/NovaCoreKit

      - name: 组装
        run: |
          cp *.h output/NovaCoreKit.framework/Headers/
          cp Info.plist output/NovaCoreKit.framework/
          cp PrivacyInfo.xcprivacy output/NovaCoreKit.framework/
          printf 'framework module NovaCoreKit {\n    umbrella header "NovaCoreKit.h"\n    export *\n    module * { export * }\n}\n' > output/NovaCoreKit.framework/Modules/module.modulemap

      - name: 打包
        run: |
          cd output
          zip -r ../NovaCoreKit.framework.zip NovaCoreKit.framework/

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: NovaCoreKit.framework
          path: NovaCoreKit.framework.zip
